version: "3.9"

# =============================================================================
# Kairo — Docker Swarm Stack
# =============================================================================
# Deploy:
#   docker stack deploy -c infra/swarm/docker-stack.yml kairo
#
# Pre-create all secrets on the swarm manager before deploying:
#   echo "your_value" | docker secret create jwt_secret -
#   echo "postgresql+asyncpg://..." | docker secret create database_url -
#   echo "your_password" | docker secret create db_password -
#   echo "your_key" | docker secret create s3_access_key -
#   echo "your_key" | docker secret create s3_secret_key -
#   echo "your_password" | docker secret create minio_root_password -
#
# No ENV variable is set → ConfigResolver runs in production mode.
# =============================================================================

secrets:
  jwt_secret:
    external: true
  database_url:
    external: true
  db_password:
    external: true
  s3_access_key:
    external: true
  s3_secret_key:
    external: true
  minio_root_password:
    external: true


services:

  # =========================
  # EDGE (NGINX REVERSE PROXY)
  # =========================
  edge:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    depends_on:
      - web
      - api
      - ws
    networks:
      - kairo_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]


  # =========================
  # FRONTEND WEB (VITE + NGINX)
  # =========================
  web:
    image: ghcr.io/aaron-fredrick/kairo-web:latest
    networks:
      - kairo_net
    deploy:
      replicas: 3


  # =========================
  # API SERVICE
  # =========================
  api:
    image: ghcr.io/aaron-fredrick/kairo-api:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kairo
      DB_USER: kairo
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://storage:9000
      STORAGE_BACKEND: minio
      JWT_ALGORITHM: HS256
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    secrets:
      - jwt_secret
      - database_url
      - s3_access_key
      - s3_secret_key
    networks:
      - kairo_net
    deploy:
      replicas: 4


  # =========================
  # WEBSOCKETS SERVICE
  # =========================
  ws:
    image: ghcr.io/aaron-fredrick/kairo-ws:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kairo
      DB_USER: kairo
      REDIS_HOST: redis
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    secrets:
      - database_url
    networks:
      - kairo_net
    deploy:
      replicas: 2


  # =========================
  # WORKERS
  # =========================

  worker_db:
    image: ghcr.io/aaron-fredrick/kairo-worker-db:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kairo
      DB_USER: kairo
      REDIS_HOST: redis
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    secrets:
      - database_url
    networks:
      - kairo_net
    deploy:
      replicas: 2


  worker_thumbnail:
    image: ghcr.io/aaron-fredrick/kairo-worker-thumbnail:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kairo
      DB_USER: kairo
      REDIS_HOST: redis
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    secrets:
      - database_url
    networks:
      - kairo_net
    deploy:
      replicas: 2


  worker_blob:
    image: ghcr.io/aaron-fredrick/kairo-worker-blob:latest
    environment:
      MINIO_ENDPOINT: http://storage:9000
      STORAGE_BACKEND: minio
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    secrets:
      - s3_access_key
      - s3_secret_key
    networks:
      - kairo_net
    deploy:
      replicas: 2


  # =========================
  # REDIS (EVENT BUS)
  # =========================
  redis:
    image: redis:7-alpine
    networks:
      - kairo_net
    deploy:
      replicas: 1


  # =========================
  # POSTGRES (PRIMARY DB)
  # =========================
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kairo
      POSTGRES_DB: kairo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kairo_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]


  # =========================
  # OBJECT STORAGE (MINIO)
  # =========================
  storage:
    image: minio/minio
    # MinIO does not support the _FILE env convention; entrypoint reads the
    # Docker secret and exports the real env var before launching the server.
    entrypoint: >
      /bin/sh -c
      'export MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_root_password) &&
       minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: kairo
    secrets:
      - minio_root_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    networks:
      - kairo_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]


  # =========================
  # OPEN TELEMETRY COLLECTOR
  # =========================
  otel:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel.yaml"]
    volumes:
      - ./otel.yaml:/etc/otel.yaml
    networks:
      - kairo_net
    deploy:
      replicas: 1


  # =========================
  # PROMETHEUS
  # =========================
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - kairo_net
    deploy:
      replicas: 1


  # =========================
  # LOKI (LOGS)
  # =========================
  loki:
    image: grafana/loki:latest
    networks:
      - kairo_net
    deploy:
      replicas: 1


  # =========================
  # TEMPO (TRACES)
  # =========================
  tempo:
    image: grafana/tempo:latest
    networks:
      - kairo_net
    deploy:
      replicas: 1


  # =========================
  # GRAFANA (CONTROL PLANE UI)
  # =========================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - kairo_net
    deploy:
      replicas: 1


  # =========================
  # ALERTMANAGER
  # =========================
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - kairo_net
    deploy:
      replicas: 1


networks:
  kairo_net:
    driver: overlay


volumes:
  pgdata:
  minio:


configs:
  nginx_config:
    file: ./nginx.conf