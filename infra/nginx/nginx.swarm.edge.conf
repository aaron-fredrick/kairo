worker_processes auto;

events {
    worker_connections 4096;
}

http {

    ###########################################################################
    # LIMITS
    ###########################################################################

    client_max_body_size 25M;

    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    ###########################################################################
    # LOGGING (REQUEST-ID CENTRIC)
    ###########################################################################

    log_format kairo
        'time=$time_iso8601 '
        'ip=$remote_addr '
        'method=$request_method '
        'uri=$request_uri '
        'status=$status '
        'latency=$request_time '
        'bytes=$body_bytes_sent '
        'request_id=$request_id '
        'upstream=$upstream_addr '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log kairo;
    error_log  /var/log/nginx/error.log warn;

    ###########################################################################
    # WEBSOCKET SUPPORT
    ###########################################################################

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    ###########################################################################
    # EDGE SERVER
    ###########################################################################

    server {

        listen 80 default_server;
        server_name _;

        #######################################################################
        # SECURITY HEADERS
        #######################################################################

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        #######################################################################
        # REQUEST CORRELATION (CORE DESIGN)
        #######################################################################

        # Nginx-generated request ID
        proxy_set_header X-Request-ID $request_id;

        # Forward standard proxy headers
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        #######################################################################
        # GLOBAL LIMITS
        #######################################################################

        limit_conn conn_limit 50;
        limit_req zone=global_limit burst=100 nodelay;

        #######################################################################
        # FRONTEND
        #######################################################################

        location / {
            proxy_pass http://web:53126;
        }

        #######################################################################
        # API
        #######################################################################

        location /api/ {
            proxy_pass http://api:8000/api/;
        }

        #######################################################################
        # AUTH (STRICTER LIMITS)
        #######################################################################

        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api:8000/api/auth/;
        }

        #######################################################################
        # WEBSOCKETS
        #######################################################################

        location /ws/ {
            limit_conn conn_limit 20;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;

            proxy_pass http://ws:8001/;
        }
    }
}