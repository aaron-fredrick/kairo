[project]
name = "kairo-api"
version = "0.1.0"
description = "Microservice API for Kairo"
readme = "README.md"
requires-python = "==3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Aaron Fredrick"}
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.4",
    "boto3>=1.34.0",
    "minio>=7.2.7",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "tenacity>=8.3.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "alembic>=1.13.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"